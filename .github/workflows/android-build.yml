name: Android build and tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/real-device-connection-and-ui-log
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: boombox-control-studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
